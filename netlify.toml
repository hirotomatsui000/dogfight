# Netlify builds and publishes the site on every push to the production branch, once the site is linked to this
# repository (README, "Publish as a website"). Static hosting: offline play only, like the single-file build.

[build]
  # URL is the site's address, set by Netlify; it makes the link-preview image absolute.
  command = "SITE_URL=$URL npm run build"
  publish = "dist"
  # Skip the build (exit 0) when a push changes nothing the page is made from: docs, the server, tools.
  # Without a build cache the two refs are equal, and then it always builds.
  ignore = """
    [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . \
      ':(exclude)docs' ':(exclude).handoff' ':(exclude)README.md' ':(exclude)CREDITS.md' \
      ':(exclude)src/server' ':(exclude)tools' ':(exclude)Dockerfile' ':(exclude).dockerignore' ':(exclude).claude'
  """

[build.environment]
  NODE_VERSION = "24"

# Vite puts a content hash in every file name under assets/, so a changed file gets a new name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
